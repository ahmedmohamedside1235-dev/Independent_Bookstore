<div class="backdrop" (click)="close()">
  <div class="reader" role="dialog" (click)="$event.stopPropagation()">
    <header class="d-flex justify-content-between align-items-center px-3 py-2">
      <h5 class="mb-0 text-truncate">{{ title() }}</h5>
      <button type="button" class="close-btn" (click)="close()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>

    @if (url(); as src) {
      <iframe [src]="src" allowfullscreen></iframe>
    } @else {
      <p class="p-4 mb-0">This book can't be opened right now.</p>
    }
  </div>
</div>
